<!DOCTYPE html><html lang="fr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mon agenda</title>
<style>
:root{color-scheme:dark;--bg:#14151a;--sf:#1d1f27;--sf2:#2a2d3a;--tx:#eceef4;--mu:#a2a8bc;--bd:#343849;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light;--bg:#f4f5f9;--sf:#fff;--sf2:#eceef5;--tx:#1b1d27;--mu:#5d6378;--bd:#d9dce8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--mu)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #3DA5D9;outline-offset:1px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--sf)}
header h1{font-size:18px;margin:0 6px;flex:1;min-width:150px;text-transform:capitalize}
.tabs{display:flex;gap:4px}.tabs button.on{background:#B3001B;border-color:#B3001B;color:#fff}
.wrap{flex:1;display:flex;min-height:0;position:relative}
aside{width:250px;background:var(--sf);border-right:1px solid var(--bd);padding:12px;overflow:auto;flex:none}
aside h3{margin:0 0 8px;font-size:14px;color:var(--mu);font-weight:600}
.fc{display:flex;align-items:center;gap:8px;padding:4px 0}.fs{padding-left:26px;color:var(--mu);font-size:13px}
.dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.25)}
main{flex:1;overflow:auto;min-width:0}
.mg{display:grid;grid-template-columns:repeat(7,1fr);min-height:100%;grid-auto-rows:minmax(100px,1fr)}
.mh{padding:6px;text-align:center;color:var(--mu);font-size:13px;border-bottom:1px solid var(--bd)}
.mc{border:0 solid var(--bd);border-width:0 1px 1px 0;padding:3px;min-width:0;overflow:hidden;cursor:pointer}
.mc.off{opacity:.45}.mc .n{font-size:12px;color:var(--mu);padding:2px 4px}.mc .n.today{background:#B3001B;color:#fff;border-radius:10px;display:inline-block;min-width:22px;text-align:center}
.ev{position:relative;display:flex;border-radius:6px;overflow:hidden;margin-bottom:2px;cursor:pointer;font-size:12px;line-height:1.25}
.ev .bar{width:8px;flex:none;border-right:2px solid rgba(0,0,0,.4)}.ev .eb{padding:2px 5px;min-width:0;flex:1}
.ev b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev small{opacity:.85}
.badge{display:inline-block;border-radius:9px;padding:0 7px;font-size:11px;font-weight:600;margin-top:2px;border:1px solid rgba(0,0,0,.35)}
.tg{min-width:100%}.tgh{display:flex;position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--bd)}
.tgh div{flex:1;text-align:center;padding:6px 2px;font-size:13px;color:var(--mu)}.tgh .g,.gut{width:46px;flex:none}
.tgb{display:flex;position:relative}.gut div{height:48px;font-size:11px;color:var(--mu);text-align:right;padding-right:6px;transform:translateY(-7px)}
.col{flex:1;position:relative;border-left:1px solid var(--bd);background:repeating-linear-gradient(var(--bd) 0 1px,transparent 1px 48px)}
.col .ev{position:absolute;margin:0;box-shadow:0 0 0 1px var(--bg)}
.ls{padding:12px;max-width:760px;margin:0 auto}.ls h4{margin:16px 0 6px;text-transform:capitalize;color:var(--mu)}
.ls .ev{font-size:14px}.empty{text-align:center;color:var(--mu);padding:40px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#B3001B;border:0;color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:20;padding:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:12px}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:92%;overflow:auto}
.md h2{margin:0 0 10px;font-size:18px}.md label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}
.md input:not([type=color]),.md select,.md textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.r2{display:flex;gap:8px}.r2>*{flex:1}.acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.acts .pr{background:#B3001B;border-color:#B3001B;color:#fff}
.row{display:flex;gap:6px;margin:5px 0;align-items:center}.row input[type=color]{width:38px;height:32px;padding:0;border:0;background:none;flex:none}
.row input[type=text]{flex:1;min-width:0}.sub{margin-left:28px}.cat{border-bottom:1px solid var(--bd);padding:6px 0}
.mp{white-space:nowrap;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--tx);text-decoration:none}.mp.off{opacity:.4;pointer-events:none}
.loc{display:block;font-size:11px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pv{margin:6px 0;display:flex}.pv .ev{width:220px;margin:0}
@media(max-width:760px){aside{position:absolute;z-index:30;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none;box-shadow:6px 0 20px rgba(0,0,0,.5)}.mc{padding:1px}.ev .eb{padding:1px 3px}.tg{min-width:640px}.mg{min-width:100%}}
@media(min-width:761px){#bg{display:none}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14151a"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script></head><body>
<header><button id="bg" aria-label="Filtres">☰</button><button id="td">Aujourd’hui</button><button id="pv" aria-label="Précédent">‹</button><button id="nx" aria-label="Suivant">›</button><h1 id="ti"></h1>
<div class="tabs" id="tabs"></div><button id="st" title="Paramètres">⚙ Réglages</button><button id="im" title="Importer un fichier .ics">⇪ Importer</button><span id="sy" style="font-size:12px;color:var(--mu)"></span><button id="lo">Déconnexion</button><button id="th" aria-label="Thème">◐</button><input type="file" id="fi" accept=".ics,text/calendar" hidden></header>
<div class="wrap"><aside id="sd"></aside><main id="mn"></main></div>
<button class="fab" id="add" aria-label="Ajouter un événement">+</button><div id="mo"></div>
<div id="lg" class="ov" style="display:none;z-index:60;background:var(--bg)"><div class="md"><h2>Mon agenda</h2><label for="lm">E-mail</label><input id="lm" type="email" autocomplete="username"><label for="lp">Mot de passe (6 caractères minimum)</label><input id="lp" type="password" autocomplete="current-password"><p id="lx" style="color:#ff9a9a;min-height:1.4em;font-size:13px;margin:8px 0 0"></p><div class="acts"><button id="lc">Créer mon compte</button><button class="pr" id="li">Se connecter</button></div></div></div>
<script>
const HH=48,DAYS=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'],VIEWS=[['day','Jour'],['week','Semaine'],['month','Mois'],['list','À venir']];
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const defCats=()=>[
{id:'calendrier',name:'Calendrier',color:'#B3001B',subs:[]},
{id:'anniversaires',name:'Anniversaires',color:'#00487C',subs:[]},
{id:'detente',name:'Détente',color:'#F6511D',subs:[]},
{id:'emploi',name:'Emploi',color:'#679436',subs:[]},
{id:'langues',name:'Langues',color:'#3DA5D9',subs:[{id:'anglais',name:'Anglais',color:'#FFD23F'},{id:'italien',name:'Italien',color:'#FF4FA3'}]},
{id:'loisirs',name:'Loisirs créatifs',color:'#982649',subs:[]},
{id:'quotidien',name:'Quotidien',color:'#FEC601',subs:[]},
{id:'sport',name:'Sport',color:'#137547',subs:[{id:'marche',name:'Marche',color:'#00E5A0'},{id:'step',name:'Step',color:'#FF7A59'}]}];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const day0=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const addD=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
const mon=d=>{d=day0(d);return addD(d,-((d.getDay()+6)%7))};
const same=(a,b)=>a.toDateString()===b.toDateString();
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function txt(h){const n=parseInt(h.slice(1),16),l=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255));return l>150?'#111':'#fff'}
function sample(){const t=day0(new Date()),w=mon(t);const e=(o,h,m,du,ti,c,s,r)=>{const a=addD(w,o);a.setHours(h,m);return{id:uid(),title:ti,start:iso(a),end:iso(new Date(+a+du*6e4)),cat:c,sub:s||'',rep:r||'none',notes:''}};
return[e(0,8,0,60,'Marche du matin','sport','marche','weekly'),e(1,18,30,45,'Séance de step','sport','step','weekly'),e(2,19,0,60,'Cours d’anglais','langues','anglais','weekly'),e(3,19,0,60,'Italien – vocabulaire','langues','italien','weekly'),
e(1,10,0,90,'Réunion d’équipe','emploi'),e(4,14,0,120,'Atelier peinture','loisirs'),e(5,16,0,60,'Bain et lecture','detente'),e(2,9,0,30,'Courses','quotidien'),e(3,12,0,60,'Rendez-vous banque','quotidien'),e(6,12,0,180,'Anniversaire de Léa','anniversaires','','yearly'),e(2,15,0,60,'Point projet','calendrier')]}
let S;try{S=JSON.parse(localStorage.getItem('agenda-v1'))}catch(e){}
if(!S||!S.cats){S={cats:defCats(),events:[],hidden:[],view:'week',theme:'dark'}}
S.date=new Date();const save=()=>{try{localStorage.setItem('agenda-v1',JSON.stringify({cats:S.cats,events:S.events,hidden:S.hidden,view:S.view,theme:S.theme}))}catch(e){}sched()};
const $=id=>document.getElementById(id);
const cat=id=>S.cats.find(c=>c.id===id)||S.cats[0]||{id:'',name:'?',color:'#888',subs:[]};
const sub=(c,id)=>cat(c).subs.find(s=>s.id===id);
function occ(from,to){const out=[];S.events.forEach(ev=>{if(S.hidden.includes(ev.cat)||(ev.sub&&S.hidden.includes(ev.sub)))return;const s0=new Date(ev.start),du=new Date(ev.end)-s0;
for(let k=0;k<1500;k++){const c=new Date(s0);if(ev.rep==='daily')c.setDate(c.getDate()+k);else if(ev.rep==='weekly')c.setDate(c.getDate()+7*k);else if(ev.rep==='monthly')c.setMonth(c.getMonth()+k);else if(ev.rep==='yearly')c.setFullYear(c.getFullYear()+k);else if(k>0)break;
if(c>=to)break;if(+c+du>from)out.push({ev,s:c,e:new Date(+c+du)})}});return out.sort((a,b)=>a.s-b.s)}
function chip(o,full,x){x=x||'';const c=cat(o.ev.cat),s=sub(o.ev.cat,o.ev.sub),t=txt(c.color);
return`<div class="ev" data-id="${o.ev.id}" style="${x}background:${c.color};color:${t}" title="${esc(o.ev.title)}"><span class="bar" style="background:${s?s.color:'transparent'}"></span><div class="eb"><b>${esc(o.ev.title)}</b>${full?`<small>${hm(o.s)}–${hm(o.e)}</small> `:''}${full&&o.ev.loc?`<small>📍 ${esc(o.ev.loc)}</small> `:''}${full&&o.ev.loc?`<span class="loc">📍 ${esc(o.ev.loc)}</span>`:''}${s?`<span class="badge" style="background:${s.color};color:${txt(s.color)}">${esc(s.name)}</span>`:''}</div></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=(d,o)=>d.toLocaleDateString('fr-FR',o);
function render(){document.documentElement.dataset.theme=S.theme;const v=S.view,d=S.date;
$('tabs').innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}" class="${k===v?'on':''}">${l}</button>`).join('');
$('ti').textContent=v==='day'?fmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):v==='week'?`Semaine du ${fmt(mon(d),{day:'numeric',month:'long'})}`:v==='month'?fmt(d,{month:'long',year:'numeric'}):'À venir';
$('sd').innerHTML='<h3>Calendriers</h3>'+S.cats.map(c=>`<div class="fc"><input type="checkbox" data-f="${c.id}" ${S.hidden.includes(c.id)?'':'checked'}><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</div>`+c.subs.map(s=>`<div class="fc fs"><input type="checkbox" data-f="${s.id}" ${S.hidden.includes(s.id)?'':'checked'}><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</div>`).join('')).join('');
const m=$('mn'),keep=m.querySelector('.tg')?m.scrollTop:7*HH;
if(v==='month')month();else if(v==='list')list();else grid(v==='day'?[day0(d)]:[0,1,2,3,4,5,6].map(i=>addD(mon(d),i)));
if(v==='day'||v==='week')m.scrollTop=keep;save()}
function month(){const d=S.date,f=mon(new Date(d.getFullYear(),d.getMonth(),1)),all=occ(f,addD(f,42));let h='<div class="mg">'+DAYS.map(x=>`<div class="mh">${x}</div>`).join('');
for(let i=0;i<42;i++){const c=addD(f,i),L=all.filter(o=>same(o.s,c));h+=`<div class="mc ${c.getMonth()!==d.getMonth()?'off':''}" data-day="${iso(c)}"><div class="n ${same(c,new Date())?'today':''}">${c.getDate()}</div>${L.slice(0,3).map(o=>chip(o)).join('')}${L.length>3?`<div class="n">+${L.length-3} autres</div>`:''}</div>`}
$('mn').innerHTML=h+'</div>'}
function grid(ds){const all=occ(ds[0],addD(ds[0],ds.length));let h='<div class="tg"><div class="tgh"><div class="g"></div>'+ds.map(x=>`<div style="${same(x,new Date())?'color:var(--tx);font-weight:700':''}">${fmt(x,{weekday:'short',day:'numeric'})}</div>`).join('')+'</div><div class="tgb"><div class="gut">'+Array.from({length:24},(_,i)=>`<div>${i?pad(i)+':00':''}</div>`).join('')+'</div>';
ds.forEach(x=>{const L=all.filter(o=>same(o.s,x)),lanes=[];const P=L.map(o=>{let i=lanes.findIndex(e=>e<=o.s);if(i<0)i=lanes.length;lanes[i]=o.e;return{o,i}});
h+=`<div class="col" data-day="${iso(x)}">`+P.map(({o,i})=>{const t=(o.s.getHours()*60+o.s.getMinutes())/60*HH,e=Math.min(24,(o.e-day0(x))/36e5),hh=Math.max((e*HH-t),26);return chip(o,true,`top:${t}px;height:${hh}px;left:${i*100/lanes.length}%;width:${100/lanes.length}%;`)}).join('')+'</div>'});
$('mn').innerHTML=h+'</div></div>'}
function list(){const f=day0(new Date()),L=occ(f,addD(f,90));if(!L.length){$('mn').innerHTML='<div class="empty">Rien de prévu. Appuie sur + pour ajouter un événement.</div>';return}
let h='<div class="ls">',last='';L.forEach(o=>{const k=o.s.toDateString();if(k!==last){h+=`<h4>${fmt(o.s,{weekday:'long',day:'numeric',month:'long'})}</h4>`;last=k}h+=chip(o,true)});$('mn').innerHTML=h+'</div>'}
function nav(n){const v=S.view,d=new Date(S.date);if(v==='month')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+n*(v==='week'?7:1));S.date=d;render()}
function modal(h){$('mo').innerHTML=h?`<div class="ov" id="ov"><div class="md">${h}</div></div>`:''}
function opts(c,s){return'<option value="">Aucune</option>'+cat(c).subs.map(x=>`<option value="${x.id}" ${x.id===s?'selected':''}>${esc(x.name)}</option>`).join('')}
function edit(id,startISO){const ev=S.events.find(e=>e.id===id)||{id:'',title:'',start:startISO,end:iso(new Date(+new Date(startISO)+36e5)),cat:S.cats[0].id,sub:'',rep:'none',notes:''};
const D=x=>x.slice(0,10),T=x=>x.slice(11,16);
modal(`<h2>${id?'Modifier':'Nouvel'} événement</h2><label>Titre</label><input id="e_t" value="${esc(ev.title)}" placeholder="Ex. Marche du matin"><label>Date</label><input type="date" id="e_d" value="${D(ev.start)}"><div class="r2"><div><label>Début</label><input type="time" id="e_s" value="${T(ev.start)}"></div><div><label>Fin</label><input type="time" id="e_e" value="${T(ev.end)}"></div></div>
<div class="r2"><div><label>Catégorie</label><select id="e_c">${S.cats.map(c=>`<option value="${c.id}" ${c.id===ev.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label>Sous-catégorie</label><select id="e_u">${opts(ev.cat,ev.sub)}</select></div></div>
<div class="pv" id="e_p"></div><label>Lieu (adresse ou nom d’un endroit)</label><div class="row"><input type="text" id="e_l" value="${esc(ev.loc||'')}" placeholder="Ex. 12 rue de la Gare, Thionville"><a id="e_m" class="mp" target="_blank" rel="noopener">📍 Maps</a></div><label>Répétition</label><select id="e_r">${[['none','Aucune'],['daily','Chaque jour'],['weekly','Chaque semaine'],['monthly','Chaque mois'],['yearly','Chaque année']].map(([k,l])=>`<option value="${k}" ${k===ev.rep?'selected':''}>${l}</option>`).join('')}</select><label>Notes</label><textarea id="e_n" rows="3">${esc(ev.notes)}</textarea>
<div class="acts">${id?'<button id="e_x" style="margin-right:auto">Supprimer</button>':''}<button id="e_k">Annuler</button><button class="pr" id="e_ok">Enregistrer</button></div>`);
const pv=()=>{const o={ev:{id:'',title:$('e_t').value||'Aperçu',cat:$('e_c').value,sub:$('e_u').value},s:new Date(),e:new Date()};$('e_p').innerHTML=chip(o)};pv();
$('e_c').onchange=()=>{$('e_u').innerHTML=opts($('e_c').value,'');pv()};$('e_u').onchange=pv;$('e_t').oninput=pv;const ml=()=>{const q=$('e_l').value.trim(),a=$('e_m');a.classList.toggle('off',!q);a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)};$('e_l').oninput=ml;ml();$('e_k').onclick=()=>modal('');
if(id)$('e_x').onclick=()=>{S.events=S.events.filter(e=>e.id!==id);modal('');render()};
$('e_ok').onclick=()=>{const d=$('e_d').value,s=$('e_s').value||'09:00',e=$('e_e').value||s;if(!d)return;let end=d+'T'+e;if(end<=d+'T'+s)end=iso(new Date(+new Date(d+'T'+s)+36e5));
const n={id:id||uid(),title:$('e_t').value.trim()||'Sans titre',start:d+'T'+s,end,cat:$('e_c').value,sub:$('e_u').value,rep:$('e_r').value,loc:$('e_l').value.trim(),notes:$('e_n').value};
S.events=id?S.events.map(x=>x.id===id?n:x):[...S.events,n];modal('');render()}}
function settings(){const row=(a,c,s,col,name)=>`<div class="row ${s?'sub':''}"><input type="color" value="${col}" data-a="${s?'sc':'cc'}" data-c="${c}" data-s="${s||''}"><input type="text" value="${esc(name)}" data-a="${s?'sn':'cn'}" data-c="${c}" data-s="${s||''}"><button data-a="${s?'sd':'cd'}" data-c="${c}" data-s="${s||''}" aria-label="Supprimer">✕</button></div>`;
modal('<h2>Catégories et sous-catégories</h2>'+S.cats.map(c=>`<div class="cat">${row('',c.id,'',c.color,c.name)}${c.subs.map(s=>row('',c.id,s.id,s.color,s.name)).join('')}<button class="sub" data-a="sa" data-c="${c.id}">+ Sous-catégorie</button></div>`).join('')+'<div class="acts"><button data-a="ca" style="margin-right:auto">+ Catégorie</button><button class="pr" id="e_k">Terminer</button></div>');$('e_k').onclick=()=>modal('')}
function act(el,type){const a=el.dataset.a;if(!a)return;const c=S.cats.find(x=>x.id===el.dataset.c),s=c&&c.subs.find(x=>x.id===el.dataset.s);
if(a==='cc')c.color=el.value;else if(a==='cn')c.name=el.value||c.name;else if(a==='sc')s.color=el.value;else if(a==='sn')s.name=el.value||s.name;
if(type==='click'){if(a==='cd'){if(S.cats.length<2)return;S.cats=S.cats.filter(x=>x!==c);S.events.forEach(e=>{if(e.cat===c.id){e.cat=S.cats[0].id;e.sub=''}})}
else if(a==='sd'){c.subs=c.subs.filter(x=>x!==s);S.events.forEach(e=>{if(e.sub===s.id)e.sub=''})}
else if(a==='sa')c.subs.push({id:uid(),name:'Nouvelle sous-catégorie',color:'#C77DFF'});else if(a==='ca')S.cats.push({id:uid(),name:'Nouvelle catégorie',color:'#7A7F99',subs:[]});else return;settings()}render()}
function ics(t){t=t.replace(/\r?\n[ \t]/g,'');const out=[];const pd=v=>{const m=/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?/.exec(v);if(!m)return null;const a=m.slice(1).map(Number);return m[4]===undefined?{d:new Date(a[0],a[1]-1,a[2]),all:1}:{d:m[7]?new Date(Date.UTC(a[0],a[1]-1,a[2],a[3],a[4],a[5]||0)):new Date(a[0],a[1]-1,a[2],a[3],a[4])}};
t.split('BEGIN:VEVENT').slice(1).forEach(b=>{const g=k=>{const m=new RegExp('^'+k+'(?:;[^:\\n]*)?:(.*)$','m').exec(b);return m?m[1].trim():''};const s=pd(g('DTSTART'));if(!s)return;let e=pd(g('DTEND')),en=e?e.d:null;if(!en)en=new Date(+s.d+36e5);if(s.all&&e)en=new Date(+en-6e4);if(s.all&&!e)en=new Date(+s.d+864e5-6e4);
const r=/FREQ=(DAILY|WEEKLY|MONTHLY|YEARLY)/.exec(g('RRULE'));out.push({id:uid(),title:g('SUMMARY').replace(/\\,/g,',').replace(/\\n/g,' ')||'Sans titre',start:iso(s.d),end:iso(en),cat:S.cats[0].id,sub:'',rep:r?r[1].toLowerCase():'none',loc:g('LOCATION').replace(/\\,/g,','),notes:g('DESCRIPTION').replace(/\\n/g,'\n').replace(/\\,/g,',')})});return out}
